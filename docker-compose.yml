services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=docker-deployment-secret-key-change-in-production
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL=True
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
